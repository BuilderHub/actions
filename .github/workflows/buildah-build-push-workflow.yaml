---
# Build and push with Buildah: native multi-arch (ubuntu-latest + ubuntu-22.04-arm), then manifest list.
# Uses redhat-actions/buildah-build and buildah manifest for multi-arch.
# Caller must pass secrets REGISTRY_USERNAME and REGISTRY_PASSWORD via workflow_call secrets.
name: Buildah Build and Push

on:
  workflow_call:
    inputs:
      image:
        description: "Image name"
        required: true
        type: string
      tags:
        description: "Tags (space-separated)"
        required: false
        default: "latest"
        type: string
      containerfiles:
        description: "Containerfile paths (newline for multiple)"
        required: false
        default: "./Containerfile"
        type: string
      context:
        description: "Build context path"
        required: false
        default: "."
        type: string
      registry:
        description: "Registry host/namespace"
        required: true
        type: string
      push:
        description: "Push image to registry (false = build only)"
        required: false
        default: true
        type: boolean
      labels:
        description: "Image labels (newline-separated key=value)"
        required: false
        default: ""
        type: string
      annotations:
        description: "OCI image annotations (newline-separated key=value)"
        required: false
        default: ""
        type: string
    secrets:
      REGISTRY_USERNAME:
        description: "Registry username for push"
        required: true
      REGISTRY_PASSWORD:
        description: "Registry password or token for push"
        required: true

env:
  REGISTRY: ${{ inputs.registry }}
  IMAGE: ${{ inputs.image }}
  TAGS: ${{ inputs.tags }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          # GitHub-hosted ARM: use ubuntu-22.04-arm if available in your org, or a self-hosted arm64 label
          - runner: ubuntu-22.04-arm
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to registry
        if: inputs.push
        uses: redhat-actions/podman-login@v1.7
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build (Buildah)
        id: build
        uses: redhat-actions/buildah-build@v2.13
        with:
          image: ${{ env.IMAGE }}
          tags: ${{ env.TAGS }}
          containerfiles: ${{ inputs.containerfiles }}
          context: ${{ inputs.context }}
          labels: ${{ inputs.labels }}

      - name: Tag and push arch-specific images
        if: inputs.push
        env:
          IMAGE_WITH_TAG: ${{ steps.build.outputs.image-with-tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          # Resolve image ID by the reference the buildah-build action used (image:first_tag)
          img_id=$(buildah images -q "$IMAGE_WITH_TAG" | head -1)
          for t in $TAGS; do
            ref="${REGISTRY}/${IMAGE}:${t}-${ARCH}"
            buildah tag "$img_id" "$ref"
            buildah push "$ref"
          done

  manifest:
    if: inputs.push
    name: Create and push manifest
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Log in to registry
        uses: redhat-actions/podman-login@v1.7
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Create and push manifest list
        env:
          OCI_ANNOTATIONS: ${{ inputs.annotations }}
        run: |
          for tag in $TAGS; do
            manifest="${REGISTRY}/${IMAGE}:${tag}"
            buildah manifest create "${manifest}"
            buildah manifest add "${manifest}" "docker://${REGISTRY}/${IMAGE}:${tag}-amd64"
            buildah manifest add "${manifest}" "docker://${REGISTRY}/${IMAGE}:${tag}-arm64"

            if [ -n "${OCI_ANNOTATIONS:-}" ]; then
              # buildah manifest annotate requires digest, not docker:// URL.
              digests=($(buildah manifest inspect "${manifest}" | jq -r '.manifests[].digest'))

              for digest in "${digests[@]}"; do
                annotate_args=()
                while IFS= read -r raw_line; do
                  raw_line="${raw_line%$'\r'}"
                  raw_line="${raw_line#"${raw_line%%[![:space:]]*}"}"
                  raw_line="${raw_line%"${raw_line##*[![:space:]]}"}"
                  [ -z "$raw_line" ] && continue

                  if [[ "$raw_line" != *"="* ]]; then
                    echo "Skipping invalid annotation line (missing '='): $raw_line"
                    continue
                  fi

                  key="${raw_line%%=*}"
                  val="${raw_line#*=}"

                  if [[ "$val" =~ ^\'(.*)\'$ ]]; then
                    val="${BASH_REMATCH[1]}"
                  elif [[ "$val" =~ ^\"(.*)\"$ ]]; then
                    val="${BASH_REMATCH[1]}"
                  fi

                  annotate_args+=(--annotation "${key}=${val}")
                done < <(printf '%s\n' "$OCI_ANNOTATIONS")

                if [ ${#annotate_args[@]} -gt 0 ]; then
                  buildah manifest annotate "${annotate_args[@]}" "${manifest}" "$digest"
                fi
              done
            fi

            buildah manifest push --all "${manifest}"
          done
